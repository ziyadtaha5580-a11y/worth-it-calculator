kind = "web"
previewPath = "/"
title = "Worth It?"
description = "A free, private purchase decision calculator that helps people weigh cost, affordability, work hours, and expected use before buying."
version = "1.0.0"
id = "artifacts/worth-it"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21884

[services.development]
run = "pnpm --filter @workspace/worth-it run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worth-it", "run", "build" ]
serve = "static"
publicDir = "artifacts/worth-it/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21884"
BASE_PATH = "/"
